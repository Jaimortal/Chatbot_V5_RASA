# Production Configuration
version: "3.1"

language: en

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.7
  - name: EntityExtractor
    epochs: 100
    constrain_similarities: true

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true

core:
  token: null
  nlu_threshold: 0.6
  endpoint:
    url: ${RASA_ENDPOINT}
    token: null
    project_name: null
    input_channel: null
    output_channel: null
    cors_origins: "*"
    response_timeout: 60

assistant_id: production

nlu:
  - data/nlu.yml

domain:
  - domain.yml

training_data:
  - data/stories.yml

log_level: INFO
log_file: logs/rasa_production.log

# Production-specific settings
enable_api: true
max_request_size: 1048576
response_timeout: 10
num_worker_threads: 1
port: 5005

# Security settings
jwt_secret: ${JWT_SECRET}
enable_cors: true
cors_origins: 
  - "https://yourdomain.com"
  - "https://www.yourdomain.com"

# Monitoring and analytics
enable_monitoring: true
telemetry: false
