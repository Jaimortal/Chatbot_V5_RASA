entities:
  - lab_number
  - location_name
  - category
  - sub_category
  - slot_name
  - slot_value

slots:
  category:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  sub_category:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  slot_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  slot_value:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_topic:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  lab_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: lab_number

responses:
  utter_greet:
    - text: "Hello! How can I assist you today?"
  utter_goodbye:
    - text: "Welcome as always, Feel free to ask again😊"
  utter_iamabot:
    - text: "I am a bot, here to help you."

actions:
  - action_reply_from_json
  - action_set_dynamic_slot

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
